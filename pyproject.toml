[project]
name = "rayserve"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "mlflow>=3.15.2",
    "numpy>=2.5.2",
    "ray[serve]>=2.58.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
rayserve = "rayserve:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
